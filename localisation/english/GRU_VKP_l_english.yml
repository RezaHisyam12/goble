l_english:

 # --- Focuses ---
 GRU_VKP_eco_cir:0 "Zentraler Industriebezirk"
 GRU_VKP_eco_cir_desc:0 "The old Central Industrial Region lies between the Vistula and the San, and was never finished. Plan it again as the heart of the Generalgouvernement's economy."
 GRU_VKP_eco_roads:0 "Landstraßenprogramm"
 GRU_VKP_eco_roads_desc:0 "Gravel the country roads and bridge the rivers. Produce, coal and conscripts all reach the railheads faster."
 GRU_VKP_eco_coops:0 "Genossenschaftsbewegung"
 GRU_VKP_eco_coops_desc:0 "Village cooperatives are the one institution the countryside trusts. Back them with credit and materials, and let them build."
 GRU_VKP_eco_chemical:0 "Ausbau der chemischen Industrie"
 GRU_VKP_eco_chemical_desc:0 "Nitrates, synthetic fuel and rubber from the southern plants. A war economy needs the chemistry before it needs the steel."
 GRU_VKP_eco_stalowa:0 "Stalowa Wola"
 GRU_VKP_eco_stalowa_desc:0 "The steelworks founded in the thirties are expanded into a full industrial town, with housing, a rail spur and a power station of its own."
 GRU_VKP_eco_rural_schools:0 "Landschulprogramm"
 GRU_VKP_eco_rural_schools_desc:0 "A school in every village, taught in the language the children speak at home. Literate farmers make better foremen and clerks."
 GRU_VKP_eco_munitions:0 "Rüstungsbüro Radom"
 GRU_VKP_eco_munitions_desc:0 "Radom, Starachowice and Skarżysko will be run as one armaments district, with one planning office and one set of orders."
 GRU_VKP_eco_german_integration:0 "Eingliederung in die Reichswirtschaft"
 GRU_VKP_eco_german_integration_desc:0 "Link the district to Berlin's industrial plan. Orders and capital flow in, and a part of the output flows back out."
 GRU_VKP_eco_eigen:0 "Polnische Eigenwirtschaft"
 GRU_VKP_eco_eigen_desc:0 "Keep the district's profits and its books in Polish hands, and sell to Berlin on contract rather than on command."
 GRU_VKP_eco_werkstatt:0 "Werkstatt des Ostens"
 GRU_VKP_eco_werkstatt_desc:0 "Roads, schools, steel and chemistry now form one working region. The Generalgouvernement is the workshop of the east."
 GRU_VKP_mil_root:0 "Polnische Hilfsverbände"
 GRU_VKP_mil_root_desc:0 "Berlin will not leave the east unguarded and cannot garrison all of it. Raise Polish auxiliary formations under German supervision."
 GRU_VKP_mil_ordnungsdienst:0 "Polnischer Ordnungsdienst"
 GRU_VKP_mil_ordnungsdienst_desc:0 "A Polish gendarmerie with its own chain of command takes over local policing, freeing the garrisons and reducing friction."
 GRU_VKP_mil_reserve:0 "Reservesystem"
 GRU_VKP_mil_reserve_desc:0 "Every discharged man is registered in a reserve roll and can be recalled within days."
 GRU_VKP_mil_engineers:0 "Pionierlehre"
 GRU_VKP_mil_engineers_desc:0 "Rivers, marshes and broken rail lines define the front. Train engineer battalions to bridge them and to dig in."
 GRU_VKP_mil_cavalry:0 "Kavalleriereform"
 GRU_VKP_mil_cavalry_desc:0 "The horse is still the fastest way across the eastern plains. Keep the Uhlan regiments, with modern scouts, signals and anti-tank support."
 GRU_VKP_mil_motorised:0 "Motorisierte Dragoner"
 GRU_VKP_mil_motorised_desc:0 "Put the cavalry on lorries and armoured cars. The regiments keep their names and their tradition, and gain speed and range."
 GRU_VKP_mil_academy:0 "Kriegsakademie Warschau"
 GRU_VKP_mil_academy_desc:0 "Reopen the staff college under a joint board. Polish officers will be trained to German doctrine."
 GRU_VKP_mil_wehrmacht:0 "Polnische Wehrmacht"
 GRU_VKP_mil_wehrmacht_desc:0 "Polish divisions are formally integrated into the German order of battle, sharing its radios, doctrine and staff procedures."
 GRU_VKP_mil_contracts:0 "Lieferverträge mit Berlin"
 GRU_VKP_mil_contracts_desc:0 "Berlin signs supply contracts for rifles, support weapons and spares, in exchange for first claim on the district's output."
 GRU_VKP_mil_landwacht:0 "Landwacht"
 GRU_VKP_mil_landwacht_desc:0 "A territorial guard raised from local volunteers, led by veterans of the old army and answerable to the Polish administration."
 GRU_VKP_mil_freiwilligenkorps:0 "Freiwilligenkorps"
 GRU_VKP_mil_freiwilligenkorps_desc:0 "The auxiliary formations are now a corps in their own right, with their own staff, depots and badges, and a reputation to keep."

 # --- Ideas ---
 GRU_VKP_central_industrial_region_1:0 "Zentraler Industriebezirk"
 GRU_VKP_central_industrial_region_1_desc:0 "Planning for the Central Industrial Region has begun."
 GRU_VKP_central_industrial_region:0 "Zentraler Industriebezirk"
 GRU_VKP_central_industrial_region_desc:0 "Planning for the Central Industrial Region has begun."
 GRU_VKP_central_industrial_region_2:0 "Zentraler Industriebezirk"
 GRU_VKP_central_industrial_region_2_desc:0 "The chemical plants are in operation and new construction is under way."
 GRU_VKP_central_industrial_region_3:0 "Zentraler Industriebezirk"
 GRU_VKP_central_industrial_region_3_desc:0 "The armaments district is operating under a single planning office."
 GRU_VKP_central_industrial_region_4:0 "Zentraler Industriebezirk"
 GRU_VKP_central_industrial_region_4_desc:0 "The region is one working economy, the workshop of the east."
 GRU_VKP_rural_schools:0 "Landschulprogramm"
 GRU_VKP_rural_schools_desc:0 "Village schools are producing a literate generation of foremen and clerks."
 GRU_VKP_german_integration:0 "Eingliederung in die Reichswirtschaft"
 GRU_VKP_german_integration_desc:0 "The district's industry is part of Berlin's plan, and a share of its output flows to the Reich."
 GRU_VKP_eigenwirtschaft:0 "Polnische Eigenwirtschaft"
 GRU_VKP_eigenwirtschaft_desc:0 "The district's profits and books remain in Polish hands."
 GRU_VKP_hilfsverbaende_1:0 "Polnische Hilfsverbände"
 GRU_VKP_hilfsverbaende_1_desc:0 "Polish auxiliary formations have been raised under German supervision."
 GRU_VKP_hilfsverbaende:0 "Polnische Hilfsverbände"
 GRU_VKP_hilfsverbaende_desc:0 "Polish auxiliary formations have been raised under German supervision."
 GRU_VKP_hilfsverbaende_2:0 "Polnische Hilfsverbände"
 GRU_VKP_hilfsverbaende_2_desc:0 "A reserve roll and shared staff procedures have improved the auxiliaries."
 GRU_VKP_hilfsverbaende_3:0 "Polnische Hilfsverbände"
 GRU_VKP_hilfsverbaende_3_desc:0 "The auxiliaries are a trained corps with their own staff and depots."
 GRU_VKP_ordnungsdienst:0 "Polnischer Ordnungsdienst"
 GRU_VKP_ordnungsdienst_desc:0 "A Polish gendarmerie handles local policing under its own chain of command."
 GRU_VKP_modern_cavalry:0 "Moderne Kavallerie"
 GRU_VKP_modern_cavalry_desc:0 "The Uhlan regiments have been kept, with modern scouts and signals."
 GRU_VKP_modern_cavalry_2:0 "Moderne Kavallerie"
 GRU_VKP_modern_cavalry_2_desc:0 "The cavalry regiments are now motorised dragoons."
 GRU_VKP_modern_cavalry:0 "Moderne Kavallerie"
 GRU_VKP_modern_cavalry_desc:0 "The cavalry regiments are now motorised dragoons."
 GRU_VKP_polnische_wehrmacht:0 "Polnische Wehrmacht"
 GRU_VKP_polnische_wehrmacht_desc:0 "Polish divisions share German radios, doctrine and staff procedures."
 GRU_VKP_landwacht:0 "Landwacht"
 GRU_VKP_landwacht_desc:0 "A territorial guard of local volunteers answers to the Polish administration."

 # --- Decisions ---
 GRU_VKP_reconstruction_decisions:0 "Wiederaufbau des Generalgouvernements"
 GRU_VKP_reconstruction_decisions_desc:0 "Direct the rebuilding of the district's key rail and industrial sites."
 GRU_VKP_rebuild_warsaw_hub:0 "Warschauer Hauptbahnhof ausbauen"
 GRU_VKP_rebuild_warsaw_hub_desc:0 "Warsaw is the junction of every line in the Generalgouvernement. Widen the yards and repair the river bridges."
 GRU_VKP_radom_arms_works:0 "Waffenwerk Radom"
 GRU_VKP_radom_arms_works_desc:0 "Build a new arms factory at Radom, next to the existing works."
 GRU_VKP_expand_the_district:0 "Industriebezirk erweitern"
 GRU_VKP_expand_the_district_desc:0 "Add a new industrial complex to the Central Industrial Region."

 # --- Dynamic modifier and tooltips ---
 GRU_VKP_reconstruction_dm:0 "Wiederaufbauprogramm"
 GRU_VKP_reconstruction_dm_desc:0 "The Generalgouvernement's reconstruction programme, shaped by the roads, cooperatives and projects chosen so far."
 GRU_VKP_tt_decisions:0 "Unlocks new §YReconstruction§! decisions."
 GRU_VKP_tt_closer:0 "§YAutonomy§! decreases slightly, tying the Generalgouvernement closer to Berlin."
 GRU_VKP_tt_looser:0 "§YAutonomy§! increases slightly, giving the Polish administration more room."
 GRU_VKP_autonomy_closer:0 "Closer ties to Berlin"
 GRU_VKP_autonomy_looser:0 "Polish self-administration"
