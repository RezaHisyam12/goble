l_english:

 # --- Focuses ---
 GRU_VKN_land_root:0 "Festung Holland"
 GRU_VKN_land_root_desc:0 "The British will come across the North Sea sooner or later. The Netherlands is flat, wet and densely built, and it can be defended if it is prepared."
 GRU_VKN_land_dyke_guard:0 "Deichwacht"
 GRU_VKN_land_dyke_guard_desc:0 "Every dyke, sluice and pumping station gets a standing watch drawn from the local population, trained to repair and to hold."
 GRU_VKN_land_bunker_belt:0 "Bunkergürtel"
 GRU_VKN_land_bunker_belt_desc:0 "Concrete strongpoints around every town of any size, built by the provincial works offices and sited to cover the roads."
 GRU_VKN_land_rhine_line:0 "Rhein-Maas-Linie"
 GRU_VKN_land_rhine_line_desc:0 "The river crossings form the second line. Heavy bunkers cover the bridges and the approaches to Utrecht and Arnhem."
 GRU_VKN_land_reich_garrison:0 "Reichsgarnison"
 GRU_VKN_land_reich_garrison_desc:0 "Berlin sends rifles, support weapons and anti-tank guns, on condition that German liaison officers sit in the Dutch staffs."
 GRU_VKN_land_anti_tank:0 "Panzerabwehr"
 GRU_VKN_land_anti_tank_desc:0 "A British landing will come with tanks. Anti-tank guns and trained crews are distributed to every sector of the coast."
 GRU_VKN_land_counterlanding:0 "Gegenlandungsübungen"
 GRU_VKN_land_counterlanding_desc:0 "Troops are drilled to counter-attack the beachhead within hours, before the enemy can land its heavy equipment."
 GRU_VKN_land_waterlines:0 "Wasserlinien vorbereiten"
 GRU_VKN_land_waterlines_desc:0 "The old waterlines can be flooded in days, turning the approaches to Holland into a lake. The sluices and pumps are overhauled and manned."
 GRU_VKN_land_fortress:0 "Die Festung vollendet"
 GRU_VKN_land_fortress_desc:0 "Bunkers, waterlines, reserves and a trained militia now form one system. A British landing would face a country that has been preparing for it."
 GRU_VKN_sea_root:0 "Küsten- und Seeverteidigung"
 GRU_VKN_sea_root_desc:0 "The coast from the Scheldt to the Wadden Sea is open to anyone with a fleet. It must be fortified, mined and covered from the air."
 GRU_VKN_sea_coastal_batteries:0 "Küstenbatterien"
 GRU_VKN_sea_coastal_batteries_desc:0 "Heavy guns in concrete casemates cover the harbour mouths and the roads off the Hook and IJmuiden."
 GRU_VKN_sea_minefields:0 "Seeminensperren"
 GRU_VKN_sea_minefields_desc:0 "The shallow approaches to the Dutch coast are ideal for mines. Channels are laid out, charted and kept secret."
 GRU_VKN_sea_flak:0 "Flak- und Beobachtungsnetz"
 GRU_VKN_sea_flak_desc:0 "Observation posts on every dune and church tower, with flak batteries and a central plotting room at The Hague."
 GRU_VKN_sea_port_security:0 "Hafen- und Werftsicherung"
 GRU_VKN_sea_port_security_desc:0 "Rotterdam and Amsterdam must keep working under bombardment. Repair crews, spare parts and shelters are organised in advance."
 GRU_VKN_sea_flotilla:0 "Küstenflottille"
 GRU_VKN_sea_flotilla_desc:0 "Light craft, minelayers and a few submarines, built to fight in shallow waters rather than on the open sea."
 GRU_VKN_sea_air_cover:0 "Jagdschutz der Küste"
 GRU_VKN_sea_air_cover_desc:0 "Fighter wings based on dispersed fields behind the dunes, directed from the plotting room against anything that crosses the coast."
 GRU_VKN_sea_reich_liaison:0 "Marine- und Luftwaffenverbindung"
 GRU_VKN_sea_reich_liaison_desc:0 "German naval and air staffs share the Dutch plotting rooms, and Luftwaffe squadrons use Dutch fields."
 GRU_VKN_sea_dutch_command:0 "Niederländisches Küstenkommando"
 GRU_VKN_sea_dutch_command_desc:0 "The coastal commands stay under Dutch officers who know the waters, and report to the Dutch administration."
 GRU_VKN_sea_shield:0 "Der Nordseeschild"
 GRU_VKN_sea_shield_desc:0 "Guns, mines, fighters and fast boats cover the entire coast. A British fleet would have to fight for every mile of it."

 # --- Ideas ---
 GRU_VKN_homeland_defence_1:0 "Festung Holland"
 GRU_VKN_homeland_defence_1_desc:0 "The homeland is organised for defence."
 GRU_VKN_homeland_defence:0 "Festung Holland"
 GRU_VKN_homeland_defence_desc:0 "The homeland is organised for defence."
 GRU_VKN_homeland_defence_2:0 "Festung Holland"
 GRU_VKN_homeland_defence_2_desc:0 "A belt of bunkers is being built around the towns."
 GRU_VKN_homeland_defence_3:0 "Festung Holland"
 GRU_VKN_homeland_defence_3_desc:0 "The waterlines are ready to be flooded and the bunkers continue."
 GRU_VKN_homeland_defence_4:0 "Festung Holland"
 GRU_VKN_homeland_defence_4_desc:0 "Bunkers, waterlines and reserves form a single defensive system."
 GRU_VKN_dyke_guard:0 "Deichwacht"
 GRU_VKN_dyke_guard_desc:0 "Every dyke, sluice and pumping station has a trained local watch."
 GRU_VKN_counterlanding:0 "Gegenlandungsübungen"
 GRU_VKN_counterlanding_desc:0 "Troops are drilled to counter-attack a beachhead within hours."
 GRU_VKN_coastal_defence_1:0 "Küstenverteidigung"
 GRU_VKN_coastal_defence_1_desc:0 "The coast is being fortified."
 GRU_VKN_coastal_defence:0 "Küstenverteidigung"
 GRU_VKN_coastal_defence_desc:0 "The coast is being fortified."
 GRU_VKN_coastal_defence_2:0 "Küstenverteidigung"
 GRU_VKN_coastal_defence_2_desc:0 "The coast is fortified and its approaches are mined."
 GRU_VKN_air_watch:0 "Flak- und Beobachtungsnetz"
 GRU_VKN_air_watch_desc:0 "Observation posts and flak batteries cover the coast."
 GRU_VKN_port_security:0 "Hafen- und Werftsicherung"
 GRU_VKN_port_security_desc:0 "Repair crews and shelters keep the ports working under attack."
 GRU_VKN_reich_liaison:0 "Marine- und Luftwaffenverbindung"
 GRU_VKN_reich_liaison_desc:0 "German naval and air staffs work alongside the Dutch."
 GRU_VKN_coastal_command:0 "Niederländisches Küstenkommando"
 GRU_VKN_coastal_command_desc:0 "Dutch officers command the coastal defences."
 GRU_VKN_atlantic_shield:0 "Der Nordseeschild"
 GRU_VKN_atlantic_shield_desc:0 "Guns, mines, fighters and fast boats cover the whole coast."

 # --- Decisions ---
 GRU_VKN_waterlines:0 "Die Wasserlinien"
 GRU_VKN_waterlines_desc:0 "Flood or drain the inundation lines that protect the heart of the Netherlands."
 GRU_VKN_inundate_the_water_lines:0 "Wasserlinien fluten"
 GRU_VKN_inundate_the_water_lines_desc:0 "Open the sluices and flood the land in front of the defensive lines. It will take two weeks, and the flooded land and its buildings will be damaged."
 GRU_VKN_drain_the_water_lines:0 "Wasserlinien entwässern"
 GRU_VKN_drain_the_water_lines_desc:0 "Pump the land dry again and restore the fields and roads."

 # --- Dynamic modifier and tooltips ---
 GRU_VKN_invasion_alert_dm:0 "Alarmbereitschaft"
 GRU_VKN_invasion_alert_dm_desc:0 "The defensive preparations pay off while the country is at war with the British."
 GRU_VKN_alert_add_tt:0 "Defensive focuses build up an §YInvasion Alert§! bonus, which applies only while at war with the §YBritish§!."
 GRU_VKN_waterlines_tt:0 "Unlocks the decisions to §Yflood§! and §Ydrain§! the waterlines."
 GRU_VKN_tt_closer:0 "§YAutonomy§! decreases slightly, tying the Netherlands closer to Berlin."
 GRU_VKN_tt_looser:0 "§YAutonomy§! increases slightly, giving the Dutch administration more room."
 GRU_VKN_autonomy_closer:0 "Closer ties to Berlin"
 GRU_VKN_autonomy_looser:0 "Dutch self-administration"

 # --- Events ---
 GRU_VKN_events.1.t:0 "Die Festung steht"
 GRU_VKN_events.1.d:0 "The inspectors report that the last bunker on the Rhine line is manned, the sluices are tested and the reserves know their sectors. The Netherlands is not an easy country to invade."
 GRU_VKN_events.1.a:0 "Let them come."
 GRU_VKN_events.2.t:0 "Der Nordseeschild"
 GRU_VKN_events.2.d:0 "The coastal batteries are ranged, the channels are mined and the plotting room at The Hague has tracked its first exercise raid from take-off to the dunes. The coast is covered."
 GRU_VKN_events.2.a:0 "The coast is ours."
