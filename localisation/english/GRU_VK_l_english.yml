l_english:

 # --- Focuses ---
 GRU_VK_mil_root:0 "Aufbau des Miliz-Kommissariats"
 GRU_VK_mil_root_desc:0 "The Kommissariat needs an army of its own to hold the eastern marches. Set up a command staff and begin registering the militia rolls."
 GRU_VK_mil_wehrbezirke:0 "Wehrbezirke"
 GRU_VK_mil_wehrbezirke_desc:0 "Divide the territory into recruiting districts, each responsible for registering, drilling and mobilising its own reservists."
 GRU_VK_mil_grenzwacht:0 "Grenzwachkorps"
 GRU_VK_mil_grenzwacht_desc:0 "Raise a permanent frontier corps. Its men know the ground, the villages and the roads the enemy will come down."
 GRU_VK_mil_reich_arms:0 "Rüstungshilfe des Reiches"
 GRU_VK_mil_reich_arms_desc:0 "Berlin has agreed to release surplus rifles and field equipment, in exchange for a say in how the Kommissariat is armed."
 GRU_VK_mil_loyal_corps:0 "Treues Hilfskorps"
 GRU_VK_mil_loyal_corps_desc:0 "Place the Kommissariat's divisions under Berlin's staff standards. They will fight as part of the Reich's army and be supplied like it."
 GRU_VK_mil_volksarmee:0 "Die eigene Volksarmee"
 GRU_VK_mil_volksarmee_desc:0 "The Kommissariat's people will not fight under a foreign flag. Build a national army under its own officers and its own colours."
 GRU_VK_mil_fortified_belt:0 "Der Befestigte Gürtel"
 GRU_VK_mil_fortified_belt_desc:0 "A continuous belt of trenches, bunkers and anti-tank ditches, laid out by the Wehrbezirke and manned by the Grenzwachkorps."
 GRU_VK_mil_war_school:0 "Kriegsschule des Kommissariats"
 GRU_VK_mil_war_school_desc:0 "A staff college for the Kommissariat's officers, teaching the lessons of the last campaigns while they are still fresh."
 GRU_VK_mil_shield:0 "Schild des Ostens"
 GRU_VK_mil_shield_desc:0 "The Kommissariat has become the Reich's shield in the east. Its army is organised, trained and entrenched, and it knows what it is fighting for."
 GRU_VK_eco_root:0 "Der Volkswirtschaftsplan"
 GRU_VK_eco_root_desc:0 "Draw up a first economic plan for the Kommissariat, with targets for coal, grain, rail and workshops, and a commissioner to answer for each."
 GRU_VK_eco_survey:0 "Rohstoffkataster"
 GRU_VK_eco_survey_desc:0 "Survey every mine, quarry and forest. A resource nobody has counted cannot be planned, and cannot be sent to the front."
 GRU_VK_eco_infrastructure:0 "Bahn- und Straßenbau"
 GRU_VK_eco_infrastructure_desc:0 "Re-lay the war-damaged rails and metal the main roads. Production cannot reach the front if it cannot leave the factory."
 GRU_VK_eco_agrar:0 "Landwirtschaftsplan"
 GRU_VK_eco_agrar_desc:0 "Deliveries are fixed, tools and seed are issued, and the collective estates are organised. A hungry workforce builds nothing."
 GRU_VK_eco_civ_works:0 "Volkswerkstätten"
 GRU_VK_eco_civ_works_desc:0 "Open workshops and plants in every district, each with a trade school attached, so labour arrives trained."
 GRU_VK_eco_arms_works:0 "Rüstungsbetriebe"
 GRU_VK_eco_arms_works_desc:0 "Convert the larger plants to arms production, on the assumption that the Kommissariat will have to arm itself."
 GRU_VK_eco_reichsplan:0 "Einbindung in den Reichswirtschaftsplan"
 GRU_VK_eco_reichsplan_desc:0 "Tie the Kommissariat's economy to Berlin's plan. Orders and materials flow from the centre, and the Reich's industry benefits from what the Kommissariat delivers."
 GRU_VK_eco_autarky:0 "Das autarke Volksprogramm"
 GRU_VK_eco_autarky_desc:0 "The Kommissariat's output belongs first to its own people. Build a self-sufficient economy, and trade with Berlin on equal terms."
 GRU_VK_eco_hochschule:0 "Technische Hochschule"
 GRU_VK_eco_hochschule_desc:0 "Found a technical college in the capital. Engineers trained locally will keep the plants running without foreign specialists."
 GRU_VK_eco_union:0 "Die Wirtschaftsunion des Kommissariats"
 GRU_VK_eco_union_desc:0 "Roads, rails, plants, schools and farms are one planned economy. The Kommissariat feeds its own people and arms its own army."

 # --- Ideas ---
 GRU_VK_militia_command:0 "Miliz-Kommando"
 GRU_VK_militia_command_desc:0 "A staff exists to register and organise the Kommissariat's militia."
 GRU_VK_military_districts:0 "Wehrbezirke"
 GRU_VK_military_districts_desc:0 "Each district recruits, drills and mobilises its own reservists."
 GRU_VK_border_guard:0 "Grenzwachkorps"
 GRU_VK_border_guard_desc:0 "A permanent frontier corps that knows the ground."
 GRU_VK_loyal_corps:0 "Treues Hilfskorps"
 GRU_VK_loyal_corps_desc:0 "The Kommissariat's divisions fight to the Reich's standards and are supplied like Reich troops."
 GRU_VK_volksarmee:0 "Die eigene Volksarmee"
 GRU_VK_volksarmee_desc:0 "A national army under its own officers and its own colours."
 GRU_VK_fortified_belt:0 "Der Befestigte Gürtel"
 GRU_VK_fortified_belt_desc:0 "Trenches, bunkers and anti-tank ditches cover the frontier."
 GRU_VK_shield_of_the_east:0 "Schild des Ostens"
 GRU_VK_shield_of_the_east_desc:0 "An organised, trained and entrenched army holds the eastern marches."
 GRU_VK_planned_economy:0 "Volkswirtschaftsplan"
 GRU_VK_planned_economy_desc:0 "Targets are set, commissioners are named and output is counted."
 GRU_VK_resource_survey:0 "Rohstoffkataster"
 GRU_VK_resource_survey_desc:0 "Every mine, quarry and forest has been surveyed and registered."
 GRU_VK_agrarplan:0 "Landwirtschaftsplan"
 GRU_VK_agrarplan_desc:0 "Fixed deliveries, issued tools and organised estates keep the workforce fed."
 GRU_VK_reichsplan:0 "Reichswirtschaftsplan"
 GRU_VK_reichsplan_desc:0 "The Kommissariat's economy is tied into Berlin's plan, and Berlin benefits from its output."
 GRU_VK_autarky:0 "Autarkes Volksprogramm"
 GRU_VK_autarky_desc:0 "The Kommissariat's output belongs first to its own people."
 GRU_VK_economic_union:0 "Wirtschaftsunion des Kommissariats"
 GRU_VK_economic_union_desc:0 "Roads, rails, plants, schools and farms form one planned economy."

 # --- Tooltips / modifiers ---
 GRU_VK_tribute_dm:0 "Kommissariats-Tribut"
 GRU_VK_tribute_dm_desc:0 "The Volkskommissariats' economies feed the Reich's industry."
 GRU_VK_tt_tribute:0 "§G[GRU.GetNameDef]§! gains a permanent bonus to §Yfactory output§! and §Yfactory efficiency§! of §G+1.5%§!, up to §G+10%§! in total."
 GRU_VK_tt_loyal:0 "§YAutonomy§! decreases slightly, tying the Kommissariat closer to Berlin."
 GRU_VK_tt_independent:0 "§YAutonomy§! increases slightly, pulling the Kommissariat away from Berlin."
 GRU_VK_autonomy_closer:0 "Closer ties to Berlin"
 GRU_VK_autonomy_looser:0 "Independent ambitions"
